:root{
  /* layout idea: a child's 生字簿 — left page reads the character, right page is the 田字格 you write in */
  --paper:#fbfaf6;
  --ink:#1f2a2e;
  --soft:#6b7a7f;
  --grid:#e46b6b;
  --accent:#2f7d6d;     /* 作業簿封面綠 */
  --accent-soft:#e2f0ec;
  --sun:#f2b33d;        /* 星星 */
  --line:#dcd8cc;
  --card:#ffffff;
  --kai:"MOEKai","BiauKai","DFKai-SB","Kaiti TC","STKaiti",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card)}
@media (max-width:1320px){header h1{display:none}}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.05em;white-space:nowrap}
.lessons{display:flex;gap:6px;flex-wrap:wrap}
.lessons button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:18px}
.lessons button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.modes{margin-left:auto;display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:3px}
.modes button{border:0;background:transparent;padding:5px 14px;border-radius:9px;font-size:18px;color:var(--soft)}
.modes button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}

.chips{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;border-bottom:1px solid var(--line);flex:none}
.chip{flex:none;width:58px;height:66px;border:1px solid var(--line);border-radius:12px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--kai);font-size:30px;color:var(--ink);position:relative}
.chip small{font-family:var(--sans);font-size:11px;color:var(--soft);height:12px;line-height:12px}
.chip[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft)}
.chip .star{position:absolute;top:3px;right:5px;font-size:12px;color:var(--sun)}

main{flex:1;min-height:0;display:grid;align-items:start;grid-template-columns:minmax(300px,1fr) minmax(320px,1.15fr);gap:16px;padding:16px;overflow:auto}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:0}
.panel h2{font-size:19px;margin:0;color:var(--soft);font-weight:600}

/* 認識 */
.hero{display:flex;align-items:center;gap:14px}
.bigbox{width:150px;height:150px;flex:none}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;font-size:16px}
.facts dt{color:var(--soft);font-size:18px}
.facts dd{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rad{font-family:var(--kai);font-size:30px;line-height:1}
.hint{font-size:17px;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:2px 8px}
.num{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}

/* 注音直排 */
.zw{display:inline-flex;align-items:center;gap:1px;vertical-align:middle}
.zw .h{font-family:var(--kai);line-height:1}
.zy{display:inline-flex;flex-direction:column;align-items:center;position:relative;font-family:var(--sans);line-height:1;padding-right:.55em}
.zy span{display:block;height:1em}
.zy .tone{position:absolute;right:0;font-size:.85em;height:auto}
.zy .light{height:.55em;line-height:.4em;text-align:center}
/* 行內文字的注音（每個國字右邊直排注音） */
.zt{line-height:2.2}
.zc{display:inline-flex;align-items:center;vertical-align:middle;margin:0 .06em}
.zc .h{line-height:1}
.zc .zy{font-size:max(.42em,9px);font-weight:400;letter-spacing:0}
.zt.k .h{font-family:var(--kai)}
/* 字的拆解 */
.split2{display:flex;flex-wrap:wrap;gap:8px}
.split2 .st{display:flex;flex-direction:column;align-items:center;width:86px;gap:2px}
.split2 svg{width:70px;height:70px;background:#fff;border:1px solid var(--line,#ddd);border-radius:8px}
.split2 .n{font-size:12px;color:var(--soft)}
.split2 .nm{font-size:16px;white-space:nowrap}
.sname{font-size:22px;min-height:44px;text-align:center}
.sname b{color:#c0392b}

.words{display:flex;flex-wrap:wrap;gap:10px}
.word{display:flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--paper)}
.word .zw .h{font-size:30px}
.word .zy{font-size:11px}
.word .me .h{color:var(--accent)}
.family{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.family button{font-family:var(--kai);font-size:26px;width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.family .none{font-size:17px;color:var(--soft)}

/* 寫字 */
.wtabs{display:flex;gap:6px}
.wtabs button{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 6px;font-size:19px;color:var(--ink)}
.wtabs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.padwrap{position:relative;width:min(100%,460px,52vh);aspect-ratio:1;margin:0 auto;border:2px solid var(--ink);border-radius:4px;background:#fff;touch-action:none}
.padwrap svg,.padwrap canvas{position:absolute;inset:0;width:100%;height:100%}
.padwrap canvas{touch-action:none}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.ctrl button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 14px;font-size:19px;color:var(--ink)}
.ctrl button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.ctrl .count{font-size:18px;color:var(--soft);font-variant-numeric:tabular-nums;min-width:80px;text-align:center}
.tip{font-size:18px;color:var(--soft);text-align:center;margin:0}

/* 遊戲 */
.game{grid-column:1/-1;max-width:760px;margin:0 auto;width:100%}
.q{display:flex;justify-content:center;gap:4px;padding:18px 0}
.q .zw .h{font-size:64px}
.q .zy{font-size:20px}
.blank{display:inline-block;width:64px;height:64px;border:3px dashed var(--grid);border-radius:8px;vertical-align:middle}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.opts button{font-family:var(--kai);font-size:54px;padding:12px 0;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.opts button.ok{border-color:var(--accent);background:var(--accent-soft)}
.opts button.no{border-color:var(--grid);opacity:.45}
.score{display:flex;justify-content:space-between;align-items:center;font-size:19px;color:var(--soft)}
.done{text-align:center;font-size:22px;padding:20px}
.origin{border:2px solid var(--accent);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;background:#f6fbf9}
.origin h2{color:var(--accent);font-weight:700;font-size:20px}
.evo{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.evo figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.evo figcaption{font-size:16px;color:var(--soft)}
.seal{width:96px;height:96px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:12px}
.seal img{max-width:78px;max-height:84px;image-rendering:auto}
.kai{width:96px;height:96px;background:#fff;border:1px solid var(--line);border-radius:12px}
.arrow{font-size:26px;color:var(--soft)}
.sw{font-family:var(--kai);font-size:20px;line-height:1.8;background:#fff;border-left:4px solid var(--accent);padding:8px 12px;border-radius:0 10px 10px 0;margin:0}
.sw .src{display:block;font-family:var(--sans);font-size:12px;color:var(--soft);padding:0;line-height:1.4}
.sw img{height:1.15em;vertical-align:-.2em;margin:0 1px}
.plain{font-size:22px;line-height:1.5;margin:0}
.plain b{color:var(--accent)}
.nosw{font-size:18px;color:var(--soft);margin:0}
.memo{border:1px dashed var(--accent);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:#fcfefd}
.memo .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tag{font-size:17px;font-weight:700;color:#fff;background:var(--accent);border-radius:999px;padding:3px 10px}
.tag.k{background:var(--sun);color:var(--ink)}
.split{font-family:var(--kai);font-size:30px;display:flex;align-items:center;gap:6px}
.split .a{color:var(--accent)}
.split .plus{font-family:var(--sans);font-size:18px;color:var(--soft)}
.story{font-size:17px;line-height:1.6;margin:0}
.sound{font-size:18px;color:var(--soft)}
.pic{width:84px;height:84px;flex:none;border-radius:12px;background:var(--accent-soft)}
.pic svg{width:100%;height:100%}
.mini{width:84px;height:84px;flex:none}
.morph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:19px;color:var(--soft)}
.morph .m{font-family:var(--kai);font-size:34px;color:var(--ink);display:inline-block}
.morph .m1{animation:squeeze 2.4s ease-in-out infinite;transform-origin:center}
@keyframes squeeze{0%,30%{transform:scaleX(1)}60%,100%{transform:scaleX(.55)}}
.look{display:flex;flex-direction:column;gap:4px;font-size:19px}
.look b{font-family:var(--kai);font-size:24px;font-weight:400;margin:0 4px}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:max-content;line-height:1.6;background:var(--ink);color:#fff;border-radius:12px;padding:6px 14px;font-size:22px;max-width:92%;text-align:center;pointer-events:none;z-index:5}
.toast.bad{background:#c0392b}
.toast.good{background:var(--accent)}
.fb{display:flex;flex-direction:column;gap:6px;align-items:center}
.fb p{margin:0;font-size:21px;text-align:center}
.fb p.good{color:var(--accent);font-weight:700}
.fb p.bad{color:#b03a2e}
.src{font-size:12px;color:var(--soft);padding:0 16px 10px;flex:none}

@media (max-width:760px){
  main{grid-template-columns:1fr}
  .modes{margin-left:0}
  .opts{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== 遊戲 ===== */
.game{grid-column:1/-1;max-width:940px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px;position:relative}
.hub{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.hub button{border:0;border-radius:24px;padding:22px 10px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-size:26px;font-weight:700;box-shadow:0 7px 0 rgba(0,0,0,.2);transition:transform .08s}
.hub button:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.hub .emo{font-size:76px;line-height:1.1}
.hub .ds{font-size:18px;font-weight:500;opacity:.95}
.hub .best{font-size:26px;color:#ffd84d;letter-spacing:2px}
.g-mole{background:#c97b3d}.g-frog{background:#2f9e6e}.g-card{background:#5b6ee1}
.hud{display:flex;align-items:center;gap:10px;font-size:22px;flex-wrap:wrap}
.hud .pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:20px;color:var(--ink)}
.hud .vbtn{margin-left:auto;font-size:22px}
.qbar{display:flex;align-items:center;justify-content:center;gap:14px;background:var(--card);border-radius:18px;padding:6px 14px;border:2px solid var(--line);flex-wrap:wrap}
.qbar .qw{display:flex;gap:4px}
.qbar .qw .zw .h{font-size:50px}
.qbar .qw .zy{font-size:17px}
.qbar .blank{width:52px;height:52px}
.qbar .qlab{font-size:20px;color:var(--soft)}
.speak{font-size:28px;border:0;background:var(--accent-soft);border-radius:50%;width:56px;height:56px}
.cover{position:absolute;inset:0;background:rgba(255,253,247,.94);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:10;padding:20px;text-align:center}
.cover .big,.result .big{font-size:84px;line-height:1}
.cover .msg,.result .msg{font-size:26px}
.go{font-size:30px;border:0;border-radius:20px;background:var(--accent);color:#fff;padding:12px 44px;box-shadow:0 6px 0 #1f5a4e}
/* 打地鼠 */
.field{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px;background:#93c86e;border-radius:24px;padding:14px 18px;touch-action:none}
.hole{position:relative;height:clamp(150px,25vh,215px);overflow:hidden}
.hole .dirt{position:absolute;left:6%;right:6%;bottom:4px;height:36px;background:#4a2f1c;border-radius:50%}
.hole .rim{position:absolute;left:3%;right:3%;bottom:0;height:22px;background:#93c86e;border-radius:0 0 50% 50%;z-index:2;pointer-events:none}
.mole{position:absolute;left:50%;bottom:-150px;transform:translateX(-50%);transition:bottom .16s ease-out;z-index:1;display:flex;flex-direction:column;align-items:center;border:0;background:none;padding:0;touch-action:none}
.mole.up{bottom:24px}
.mole .emo{font-size:clamp(44px,7vh,60px);line-height:1;transition:transform .15s}
.mole .sign{font-family:var(--kai);font-size:clamp(36px,6vh,46px);background:#fff;border:3px solid #6b4a2b;border-radius:12px;width:clamp(54px,8.5vh,66px);height:clamp(54px,8.5vh,66px);display:grid;place-items:center;margin-top:-8px;color:var(--ink)}
.mole.hit .emo{transform:scale(.75) rotate(-15deg)}
.mole.hit .sign{background:#d8f3c7;border-color:#2f9e6e}
.mole.wrong{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-58%)}50%{transform:translateX(-42%)}75%{transform:translateX(-56%)}}
.float{position:absolute;font-weight:800;font-size:28px;animation:floatUp .9s forwards;pointer-events:none;z-index:6;white-space:nowrap;text-shadow:0 2px 0 #fff}
@keyframes floatUp{to{transform:translateY(-70px);opacity:0}}
/* 青蛙過河 */
.track{display:flex;gap:4px;align-items:center;font-size:24px}
.track span{color:var(--soft)}
.river{position:relative;height:clamp(300px,46vh,420px);border-radius:24px;background:linear-gradient(#cdeeff,#5aa9e0);overflow:hidden}
.pad{position:absolute;transform:translate(-50%,-50%);width:clamp(110px,14vw,140px);height:clamp(84px,11vw,104px);background:radial-gradient(circle at 40% 35%,#9fe07a,#3f9a35);border-radius:50%;display:grid;place-items:center;font-family:var(--kai);font-size:clamp(44px,6vw,58px);color:#163a10;border:0;box-shadow:0 7px 0 #2a6a22;transition:transform .5s,opacity .5s}
.pad.start{left:50%;top:80%;width:140px;height:60px}
.pad.sink{transform:translate(-50%,-30%) scale(.75);opacity:.35}
.pad .splash{position:absolute;top:-30px;font-size:36px}
.frog{position:absolute;transform:translate(-50%,-50%);font-size:clamp(56px,8vw,74px);transition:left .5s ease-in-out,top .5s ease-in-out;z-index:3;line-height:1;pointer-events:none}
.frog.jump{animation:hop .5s}
@keyframes hop{50%{transform:translate(-50%,-50%) scale(1.45)}}
.home{position:absolute;left:50%;top:2%;transform:translateX(-50%);font-size:40px;opacity:.85}
/* 翻翻牌 */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;perspective:900px}
.card{height:clamp(96px,16vh,130px);border:0;background:none;padding:0;position:relative;transform-style:preserve-3d;transition:transform .35s}
.card.open{transform:rotateY(180deg)}
.card .b,.card .f{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center}
.card .b{background:repeating-linear-gradient(45deg,#5b6ee1 0 14px,#6c7ef0 14px 28px);color:#fff;font-size:44px;font-weight:800;box-shadow:0 5px 0 #3d4cb0}
.card .f{background:#fff;border:3px solid #5b6ee1;transform:rotateY(180deg)}
.card .ch{font-family:var(--kai);font-size:clamp(52px,9vh,70px);color:var(--ink)}
.card .bigzy{font-size:clamp(26px,4.4vh,34px)}
.card.done .f{border-color:#2f9e6e;background:#e3f6d8}
/* 結果 */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px}
.result .stars{font-size:70px;letter-spacing:10px;line-height:1}
.result .stars .on{color:#f2b33d}.result .stars .off{color:#ddd6c6}
.result .line{font-size:22px;color:var(--soft)}
.result .line.new{color:#e67e22;font-weight:700}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti span{position:absolute;top:-50px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(700px) rotate(360deg);opacity:.2}}
@media (max-width:760px){.hub{grid-template-columns:1fr}.cards{grid-template-columns:repeat(3,1fr)}}
.fsbtn{margin-left:auto;font-size:26px;width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);line-height:1}
/* 平板：上方列壓扁一點 */
.ltag{font-size:16px;color:var(--soft);white-space:nowrap}.lessons button{min-width:52px}.modes button{white-space:nowrap}
@media (max-width:1200px){.lessons button{font-size:16px;padding:3px 9px}.modes button{font-size:16px;padding:4px 10px}.lessons{gap:5px}header{flex-wrap:nowrap}}
@media (max-height:950px){header{padding:6px 12px;gap:6px 10px}.chips{padding:6px 12px}.chip{height:58px}main{padding:10px 12px;gap:12px}}
/* 全螢幕或從主畫面打開時：不顯示來源列 */
:fullscreen .src{display:none}
@media (display-mode:standalone),(display-mode:fullscreen){.src{display:none}.fsbtn{display:none}}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}

function zyCol(zy){

  const body=[...zy].filter(c=>!'ˊˇˋ˙'.includes(c));
  const tone=[...zy].find(c=>'ˊˇˋ'.includes(c));
  if(light) box.append(el('span',{class:'light'},'˙'));
  body.forEach(c=>box.append(el('span',{},c)));
  if(tone){const t=el('span',{class:'tone'},tone);const n=body.length;t.style.top=`calc(${(light?.55:0)+n-1}em - .15em)`;box.append(t)}
  return box;

/* 給孩子看的文字：每個國字都加注音。字後面的 [ㄓㄤˇ] 可指定破音字的讀法 */
function Z(s,cls=''){
  s=String(s);const box=el('span',{class:'zt '+cls});const W=DATA.zyw;let i=0,buf='';
  const flush=()=>{if(buf){box.append(buf);buf=''}};
  const put=(c,zy)=>{flush();box.append(zy?el('span',{class:'zc'},el('span',{class:'h'},c),zyCol(zy)):c)};
  while(i<s.length){
    let hit=null;for(let L=3;L>=2;L--){const w=s.substr(i,L);if(W[w]){hit=w;break}}
    if(hit){[...hit].forEach((c,k)=>put(c,W[hit][k]));i+=hit.length;continue}
    const c=s[i];
    if(/[\u3400-\u9fff\uf900-\ufaff]/.test(c)){let zy=DATA.zymap[c];if(s[i+1]==='['){const j=s.indexOf(']',i);zy=s.slice(i+2,j);i=j+1}else i++;put(c,zy)}
    else{buf+=c;i++}
  }
  flush();return box;
}

function animateStroke(svg,ch,i,done){

  line.setAttribute('clip-path',`url(#${id})`);svg.append(line);
  let len=0;for(let k=1;k<pts.length;k++)len+=Math.hypot(pts[k][0]-pts[k-1][0],pts[k][1]-pts[k-1][1]);
  len=Math.max(len,1)+260;
  line.style.strokeDasharray=len;line.style.strokeDashoffset=len;
  const dur=Math.min(1100,350+len*0.45);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const t0=performance.now();
  function step(t){const k=reduce?1:Math.min(1,(t-t0)/dur);line.style.strokeDashoffset=len*(1-k);if(k<1)anim.timer=requestAnimationFrame(step);else done&&done()}

}

/* ---- 筆畫比對（寬鬆） ---- */
function feat(pts){ // 起點、中點、終點
  let L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const tot=L[L.length-1];let mid=pts[0];
  for(let i=1;i<pts.length;i++){if(L[i]>=tot/2){const f=(tot/2-L[i-1])/((L[i]-L[i-1])||1);mid=[pts[i-1][0]+f*(pts[i][0]-pts[i-1][0]),pts[i-1][1]+f*(pts[i][1]-pts[i-1][1])];break}}
  return {s:pts[0],m:mid,e:pts[pts.length-1],len:tot};
}
const STDF={};function stdFeat(ch){if(!STDF[ch])STDF[ch]=STROKES[ch].map(st=>{const t=st.t.length>1?st.t.map(p=>[p[0],p[1]]):[[st.t[0][0],st.t[0][1]],[st.t[0][0]+1,st.t[0][1]+1]];return feat(t)});return STDF[ch]}
function fitST(pairs){ // 標準→孩子：等比縮放＋平移
  if(!pairs.length)return{s:1,tx:0,ty:0};
  let px=0,py=0,qx=0,qy=0;pairs.forEach(([P,Q])=>{px+=P[0];py+=P[1];qx+=Q[0];qy+=Q[1]});const n=pairs.length;px/=n;py/=n;qx/=n;qy/=n;
  let num=0,den=0;pairs.forEach(([P,Q])=>{num+=(P[0]-px)*(Q[0]-qx)+(P[1]-py)*(Q[1]-qy);den+=(P[0]-px)**2+(P[1]-py)**2});
  let s=den>1e3?num/den:1;s=Math.max(.35,Math.min(1.6,s));return{s,tx:qx-s*px,ty:qy-s*py};
}
const ap=(T,p)=>[T.s*p[0]+T.tx,T.s*p[1]+T.ty];
const dd=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function cost(T,S,K,rev){const a=ap(T,S.s),m=ap(T,S.m),e=ap(T,S.e);return rev?(dd(a,K.e)+dd(m,K.m)+dd(e,K.s))/3/(2048*T.s):(dd(a,K.s)+dd(m,K.m)+dd(e,K.e))/3/(2048*T.s)}
function pairsFor(ch,kids,upto){const S=stdFeat(ch),out=[];for(let k=0;k<upto;k++){const K=kids[k];out.push([S[k].s,K.s],[S[k].m,K.m],[S[k].e,K.e])}return out}
function vec(a,b){return[b[0]-a[0],b[1]-a[1]]}
function resample(pts,n=8){let L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));const tot=L[L.length-1]||1,out=[];let k=1;
  for(let q=0;q<n;q++){const d=tot*q/(n-1);while(k<pts.length-1&&L[k]<d)k++;const f=(d-L[k-1])/((L[k]-L[k-1])||1);out.push([pts[k-1][0]+f*(pts[k][0]-pts[k-1][0]),pts[k-1][1]+f*(pts[k][1]-pts[k-1][1])])}return out}
function normShape(r){let cx=0,cy=0;r.forEach(p=>{cx+=p[0];cy+=p[1]});cx/=r.length;cy/=r.length;let rms=0;r.forEach(p=>{rms+=(p[0]-cx)**2+(p[1]-cy)**2});rms=Math.sqrt(rms/r.length)||1;return r.map(p=>[(p[0]-cx)/rms,(p[1]-cy)/rms])}
function seqDist(a,b){let d=0;for(let i=0;i<a.length;i++)d+=Math.hypot(a[i][0]-b[i][0],a[i][1]-b[i][1]);return d/a.length}
const STDR={};function stdRes(ch){if(!STDR[ch])STDR[ch]=STROKES[ch].map(st=>{const t=st.t.length>1?st.t.map(p=>[p[0],p[1]]):[[st.t[0][0],st.t[0][1]],[st.t[0][0]+1,st.t[0][1]+1]];return resample(t)});return STDR[ch]}
function checkStroke(ch,kids,i,mode,raw){ // 寫完第 i 筆（0 起算）；mode: 'trace' 描寫（位置固定）或 'free'
  const S=stdFeat(ch),N=S.length;if(i>=N)return{type:'extra'};
  const K=kids[i];
  const T=(mode==='trace'||i===0)?{s:1,tx:0,ty:0}:fitST(pairsFor(ch,kids,i));
  // 1) 筆順：這一筆是不是比較像後面的某一筆
  const ci=cost(T,S[i],K,false),ciR=cost(T,S[i],K,true);
  let best=i,bc=Math.min(ci,ciR);
  for(let j=i+1;j<N;j++){const c=Math.min(cost(T,S[j],K,false),cost(T,S[j],K,true));if(c<bc){bc=c;best=j}}
  const own=Math.min(ci,ciR);
  const lim=mode==='trace'?[0.75,0.05]:(i===0?[0.55,0.14]:[0.7,0.1]);
  if(best!==i&&bc<lim[0]*own&&own>lim[1])return{type:'order',j:i,got:best};
  // 2) 方向：把兩筆都取 8 個點、去掉位置和大小，比「順著寫」和「倒著寫」哪個比較像
  if(raw&&S[i].len>0.05*2048&&K.len>0.03*2048){
    const sr=normShape(stdRes(ch)[i]),kr=normShape(resample(raw));
    const fwd=seqDist(sr,kr),rev=seqDist(sr,kr.slice().reverse());
    if(rev<0.6*fwd&&fwd>0.35)return{type:'reverse',j:i};
  }

}
function bbox(list){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;list.forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1])});return{x0,y0,x1,y1,w:x1-x0,h:y1-y0,cx:(x0+x1)/2,cy:(y0+y1)/2}}
function stdPts(ch,a=0,b){return STROKES[ch].slice(a,b).flatMap(st=>{const n=st.d.match(/-?\d+/g).map(Number);const r=[];for(let k=0;k+1<n.length;k+=2)r.push([n[k],n[k+1]]);return r})}
function checkAll(ch,kidStrokes){
  const S=stdFeat(ch),N=S.length,msgs=[],bad=new Set();
  if(kidStrokes.length<N)return{msgs:[`還少 ${N-kidStrokes.length} 筆喔，這個字有 ${N} 筆。`],bad};
  if(kidStrokes.length>N)return{msgs:[`多寫了 ${kidStrokes.length-N} 筆，這個字只有 ${N} 筆。`],bad};
  const kids=kidStrokes.map(feat);const T=fitST(pairsFor(ch,kids,N));
  const kb=bbox(kidStrokes.flat()),sb=bbox(stdPts(ch));
  // 部件比例
  const parts=partsOf(ch);const lay=DATA.info[ch].memo.lay;
  if(parts&&(lay==='LR'||lay==='TB')){
    const A=bbox(kidStrokes.slice(parts[0].from,parts[0].to).flat()),B=bbox(kidStrokes.slice(parts[1].from).flat());
    const SA=bbox(stdPts(ch,parts[0].from,parts[0].to)),SB=bbox(stdPts(ch,parts[1].from));
    const r=lay==='LR'?A.w/(A.w+B.w):A.h/(A.h+B.h),rs=lay==='LR'?SA.w/(SA.w+SB.w):SA.h/(SA.h+SB.h);
    const a=parts[0].label,b=parts[1].label;
    if(r-rs>0.13)msgs.push(lay==='LR'?`左邊的「${a}」太寬了，右邊的「${b}」要寫寬一點。`:`上面的「${a}」太高了，下面的「${b}」要寫大一點。`);
    else if(rs-r>0.13)msgs.push(lay==='LR'?`左邊的「${a}」太窄了，可以寫寬一點。`:`上面的「${a}」太矮了，可以寫高一點。`);
    const gap=lay==='LR'?(B.x0-A.x1)/kb.w-(SB.x0-SA.x1)/sb.w:(B.y0-A.y1)/kb.h-(SB.y0-SA.y1)/sb.h;
    if(gap>0.16)msgs.push(lay==='LR'?'左右兩邊離太遠了，要靠近一點。':'上下兩部分離太遠了，要靠近一點。');
  }
  // 大小、位置
  const size=Math.max(kb.w,kb.h)/Math.max(sb.w,sb.h);
  if(size<0.62)msgs.push('整個字寫太小了，要寫滿格子。');else if(size>1.3)msgs.push('字寫太大了，超出格子了。');
  const dx=(kb.cx-sb.cx)/2048,dy=(kb.cy-sb.cy)/2048;
  if(Math.abs(dx)>0.17||Math.abs(dy)>0.17){const h=Math.abs(dx)>=Math.abs(dy);msgs.push(`整個字${h?(dx>0?'偏右':'偏左'):(dy>0?'偏下':'偏上')}了，要寫在格子中間。`)}
  // 單一筆畫
  let worst=-1,we=0,wtype='';
  kids.forEach((K,k)=>{const e=cost(T,S[k],K,false);const lr=K.len/(T.s*S[k].len||1);
    let t='';if(S[k].len>0.12*2048&&lr>1.6)t='太長';else if(S[k].len>0.12*2048&&lr<0.5)t='太短';else if(e>0.17)t='位置偏了';
    if(t){bad.add(k);const sc=t==='位置偏了'?e:Math.abs(Math.log(lr))/2;if(sc>we){we=sc;worst=k;wtype=t}}});
  if(worst>=0)msgs.push(`第 ${worst+1} 筆（${DATA.info[ch].sn[worst]}）${wtype}，看看綠色的標準字。`);
  return{msgs:msgs.slice(0,2),bad};

/* ---- 🐹 打地鼠：60 秒、3 顆愛心，敲出空格裡的字 ---- */

  const tEl=el('span',{class:'pill'}),hEl=el('span',{class:'pill'}),sEl=el('span',{class:'pill'});

    field.append(el('div',{class:'hole'},el('div',{class:'dirt'}),btn,el('div',{class:'rim'})));holes.push(h);
  }

  const start=el('div',{class:'cover'},el('div',{class:'big'},'🐹'),el('div',{class:'msg'},Z('地鼠會拿著字跑出來，敲拿著「對的字」的地鼠！')),el('button',{class:'go',onclick(){start.remove();go()}},Z('開始')));

    river.querySelectorAll('.pad.c').forEach(p=>p.remove());
    frog.style.left='50%';frog.style.top='74%';frog.classList.remove('jump');
    q=mkQ(L,q);qHost.replaceChildren(qBar(q,'青蛙要跳到哪一片荷葉？'));say(`${q.w.w}，的，${q.ch}`);
    const opts=[q.ch,...distract(L,q.ch,2)].sort(()=>Math.random()-.5);
    opts.forEach((c,i)=>{
      const p=el('button',{class:'pad c'},c);p.style.left=(20+i*30)+'%';p.style.top='22%';
      p.onclick=()=>{
        if(lock||p.classList.contains('sink'))return;
        if(c===q.ch){
          lock=true;sfx('jump');frog.classList.add('jump');frog.style.left=p.style.left;frog.style.top='14%';
          T(()=>{sfx('ok');step++;drawTrack();if(step>=STEPS)win();else T(round,450)},550);
        }else{miss++;sfx('bad');p.classList.add('sink');p.append(el('span',{class:'splash'},'💦'))}
      };
      river.append(p);
    });
  }
  function win(){
    frog.style.left='50%';frog.style.top='-10%';say('回家了！');
    const stars=miss<=1?3:miss<=4?2:1;
    T(()=>result(box,'frog',stars,['青蛙回到家了！',`跳錯 ${miss} 次`]),900);
  }
  round();
}

/* ---- 🃏 翻翻牌：字卡和注音卡配成一對 ---- */
function gameCard(box,L){
  const chars=L.chars.slice().sort(()=>Math.random()-.5).slice(0,6);
  const deck=[];chars.forEach(ch=>{deck.push({ch,t:'h'});deck.push({ch,t:'z'})});deck.sort(()=>Math.random()-.5);
  let first=null,lock=false,moves=0,found=0;
  const mEl=el('span',{class:'pill'}),fEl=el('span',{class:'pill'});
  const upd=()=>{mEl.replaceChildren(Z(`翻了 ${moves} 次`));fEl.replaceChildren(Z(`找到 ${found} / ${chars.length} 對`))};
  const hud=el('div',{class:'hud'},el('button',{class:'pill',onclick:renderGame},'← ',Z('回去')),mEl,fEl,voiceBtn());
  const tip=el('div',{class:'qbar'},el('span',{class:'qlab'},Z('翻兩張牌：一張是字，一張是它的注音，配成一對！')));
  const grid=el('div',{class:'cards'});
  deck.forEach(d=>{
    const face=d.t==='h'?el('span',{class:'ch'},d.ch):(()=>{const z=zyCol(DATA.info[d.ch].zy);z.classList.add('bigzy');return z})();
    const c=el('button',{class:'card'},el('span',{class:'b'},'？'),el('span',{class:'f'},face));
    d.el=c;c.onclick=()=>flip(d);grid.append(c);
  });
  box.append(hud,tip,grid);upd();
  function flip(d){
    if(lock||d.el.classList.contains('open'))return;
    d.el.classList.add('open');sfx('flip');
    if(!first){first=d;return}
    moves++;const a=first;first=null;
    if(a.ch===d.ch){
      found++;T(()=>{sfx('ok');a.el.classList.add('done');d.el.classList.add('done');say(d.ch)},300);
      if(found===chars.length){const stars=moves<=9?3:moves<=13?2:1;T(()=>result(box,'card',stars,['全部配對成功！',`翻了 ${moves} 次`]),1200)}
    }else{lock=true;T(()=>{a.el.classList.remove('open');d.el.classList.remove('open');lock=false},1000)}
    upd();
  }
}

function render(){
  gclear();
  const L=DATA.lessons[state.lesson];
  if(!state.ch||!L.chars.includes(state.ch))state.ch=L.chars[0];
  document.getElementById('m-learn').setAttribute('aria-pressed',String(state.mode==='learn'));
  document.getElementById('m-game').setAttribute('aria-pressed',String(state.mode==='game'));
  renderLessons();renderChips();
  state.mode==='learn'?renderLearn():renderGame();
}
document.getElementById('m-learn').onclick=()=>{state.mode='learn';render()};
document.getElementById('m-game').onclick=()=>{state.mode='game';render()};
document.getElementById('title').append(Z('一上生字練習本'));
function alertBox(msg){const d=el('div',{class:'cover',style:'position:fixed;z-index:99'},el('div',{class:'msg',style:'font-size:20px;max-width:560px;line-height:1.7'},msg),el('button',{class:'go',onclick(){d.remove()}},'知道了'));document.body.append(d)}
(()=>{const b=document.getElementById('fs');const de=document.documentElement;
  const req=de.requestFullscreen||de.webkitRequestFullscreen;
  const ok=req&&(document.fullscreenEnabled||document.webkitFullscreenEnabled);
  const tip=()=>alertBox('這裡不能全螢幕。請在平板用 Safari 或 Chrome 打開 https://peinglol.github.io/kangxuan1a-shengzi/ ，再按「加入主畫面」，從主畫面圖示打開就是全螢幕。');
  b.onclick=()=>{
    if(!ok)return tip();
    const fe=document.fullscreenElement||document.webkitFullscreenElement;
    if(fe)(document.exitFullscreen||document.webkitExitFullscreen).call(document);
    else{try{const p=req.call(de);if(p&&p.catch)p.catch(tip)}catch(e){tip()}}
  };
})();
document.getElementById('m-learn').replaceChildren(Z('學生字'));
document.getElementById('m-game').replaceChildren(Z('認字遊戲'));
render();
</script>
